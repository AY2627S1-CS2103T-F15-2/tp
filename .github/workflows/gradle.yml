name: Java CI

on: [push, pull_request]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk
      - uses: gradle/actions/wrapper-validation@v6
      - name: Build one release candidate
        run: ./gradlew shadowJar verifyUniversalJar
      - uses: actions/upload-artifact@v4
        with:
          name: universal-release-candidate
          path: build/libs/Laplace.jar
          if-no-files-found: error

  build:
    needs: package
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk

      - uses: actions/download-artifact@v4
        with:
          name: universal-release-candidate
          path: build/candidate

      - name: Identify candidate and runtime
        shell: bash
        run: |
          java -version
          uname -a
          if command -v sha256sum >/dev/null; then
            sha256sum build/candidate/Laplace.jar
          else
            shasum -a 256 build/candidate/Laplace.jar
          fi

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew check coverage -PpackagedJar=build/candidate/Laplace.jar

      - name: Build and check with Gradle in a graphical session
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew check coverage -PpackagedJar=build/candidate/Laplace.jar

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
