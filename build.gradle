plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'seedu.address.Main'
    applicationDefaultJvmArgs = ['-ea']
}

tasks.withType(JavaExec).configureEach {
    enableAssertions = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

configurations {
    javafxTestRuntime
}

// Test with one matching native platform, while preserving the existing distributable dependencies.
String javaFxVersion = '17.0.7'
String operatingSystem = System.getProperty('os.name').toLowerCase(Locale.ROOT)
String architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
boolean isArm = architecture in ['aarch64', 'arm64']
String javaFxTestPlatform = operatingSystem.contains('mac') ? (isArm ? 'mac-aarch64' : 'mac')
        : operatingSystem.contains('win') ? 'win' : (isArm ? 'linux-aarch64' : 'linux')

test {
    useJUnitPlatform()
    enableAssertions = true
    // A JDK with bundled JavaFX must not silently replace the declared test runtime.
    jvmArgs '--limit-modules=java.se,jdk.unsupported', '--enable-native-access=ALL-UNNAMED'
    classpath = configurations.javafxTestRuntime + sourceSets.test.runtimeClasspath.filter {
        !it.name.startsWith('javafx-')
    }
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'

    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        javafxTestRuntime("org.openjfx:javafx-${module}:${javaFxVersion}:${javaFxTestPlatform}") {
            transitive = false
        }
    }

    implementation "org.openjfx:javafx-base:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:linux"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

shadowJar {
    archiveFileName = 'Laplace.jar'
}

defaultTasks 'clean', 'test'

// This feature must cover its UI wiring as well as the isolated completion engine.
def autocompleteClasses = [
    'seedu/address/logic/completion/Completion',
    'seedu/address/logic/completion/CompletionService',
    'seedu/address/ui/CompletionController',
    'seedu/address/ui/CommandBox'
]

tasks.register('autocompleteCoverageVerification') {
    dependsOn coverage
    doLast {
        File report = coverage.reports.xml.outputLocation.get().asFile
        if (!report.isFile()) {
            throw new GradleException('Missing autocomplete coverage report: ' + report)
        }
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        def document = factory.newDocumentBuilder().parse(report)
        def classes = document.getElementsByTagName('class')
        def required = autocompleteClasses.collectEntries { [(it): null] }
        required['seedu/address/ui/MainWindow'] = ['fillInnerParts']
        required['seedu/address/logic/parser/DirectorySearchCommandParser'] = ['<clinit>']
        required.each { className, methodNames ->
            def node = (0..<classes.length).collect { classes.item(it) }
                    .find { it.getAttribute('name') == className }
            if (node == null) {
                throw new GradleException('Missing coverage class: ' + className)
            }
            def elements = methodNames == null ? [node] : methodNames.collect { methodName ->
                def methods = node.getElementsByTagName('method')
                def method = (0..<methods.length).collect { methods.item(it) }
                        .find { it.getAttribute('name') == methodName }
                if (method == null) {
                    throw new GradleException('Missing coverage method: ' + className + '.' + methodName)
                }
                method
            }
            elements.each { element ->
                def counters = element.childNodes
                def directCounters = (0..<counters.length).collect { counters.item(it) }
                        .findAll { it.nodeName == 'counter' }
                ['INSTRUCTION', 'LINE', 'BRANCH'].each { counterType ->
                    def counter = directCounters.find { it.getAttribute('type') == counterType }
                    // JaCoCo omits BRANCH only for straight-line code; other counters are required.
                    if (counter == null && counterType != 'BRANCH') {
                        throw new GradleException('Missing ' + counterType + ' coverage: ' + className)
                    }
                    if (counter != null && counter.getAttribute('missed').toInteger() != 0) {
                        throw new GradleException('Autocomplete requires 100% ' + counterType + ': '
                                + className + '.' + element.getAttribute('name'))
                    }
                }
            }
        }
        logger.lifecycle('Autocomplete coverage: 100% instructions, lines and branches, including UI wiring.')
    }
}

check.dependsOn autocompleteCoverageVerification

// Run the keyboard smoke test against the packaged classes/FXML, with matching platform natives first.
tasks.register('verifyPackagedAutocomplete', JavaExec) {
    dependsOn shadowJar, testClasses
    classpath = configurations.javafxTestRuntime + files(shadowJar.archiveFile) + sourceSets.test.output
    mainClass = 'seedu.address.ui.PackagedAutocompleteProbe'
    jvmArgs '--limit-modules=java.se,jdk.unsupported', '--enable-native-access=ALL-UNNAMED'
    workingDir layout.buildDirectory.dir('packaged-autocomplete-sandbox')
    doFirst {
        workingDir.mkdirs()
        args layout.buildDirectory.file('reports/laplace/packaged-autocomplete-session.txt').get().asFile.absolutePath,
                shadowJar.archiveFile.get().asFile.absolutePath
    }
}

check.dependsOn verifyPackagedAutocomplete
